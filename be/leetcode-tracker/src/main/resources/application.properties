spring.application.name=leetcode-tracker

jwt.secret=${JWT_SECRET}
jwt.expiry=${JWT_EXPIRY:PT24H}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/leetcode}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

springdoc.swagger-ui.url=/v3/api-docs
server.forward-headers-strategy=framework

leetcode-graphql.base-url=https://leetcode.com/graphql
leetcode-graphql.connect-timeout=2s
leetcode-graphql.read-timeout=5s

cors.allowed-origins=https://yousefelghoul.gitlab.io
cors.allowed-origin-patterns=http://localhost:*,https://localhost:*,https://*.yousefelghoul.me,http://*.yousefelghoul.me
