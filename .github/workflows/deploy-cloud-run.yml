# Required GitHub Secrets
# ─────────────────────────────────────────────────────────────
# GCP Authentication:
#   WIF_PROVIDER          — Workload Identity Federation provider resource name
#   WIF_SERVICE_ACCOUNT   — Workload Identity Federation service account email
#   GCP_PROJECT_ID        — Google Cloud project ID
#
# Docker Hub:
#   DOCKERHUB_USERNAME    — Docker Hub account name
#   DOCKERHUB_TOKEN       — Docker Hub access token (not an account password)
#
# Cloud Run:
#   CLOUD_RUN_SERVICE_NAME — Cloud Run service name
#   GCP_REGION             — GCP region (e.g., us-central1)
#
# Application Secrets (add each to the env_vars block below):
#   JWT_SECRET             — Base64-encoded secret key for signing JWT tokens
#   DATASOURCE_URL         — PostgreSQL connection URL
#   DB_USERNAME            — Database username
#   DB_PASSWORD            — Database password
# ─────────────────────────────────────────────────────────────

name: Build and Deploy to Cloud Run

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/leetcode-tracker:${{ github.sha }}


jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and package
        run: ./mvnw --batch-mode verify

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE }} \
            .
          docker push \
            ${{ env.IMAGE }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          token_format: access_token
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
          region: ${{ secrets.GCP_REGION }}
          image: ${{ env.IMAGE }}
          flags: --allow-unauthenticated --port=8080 --memory=768Mi
          env_vars: |
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            DATASOURCE_URL=${{ secrets.DATASOURCE_URL }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
